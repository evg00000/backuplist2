name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 (i686)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 make
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Package
        run: |
          mkdir -p dist/backuplist2
          cp build/backuplist.exe README.md README.ru.md LICENSE CHANGELOG.md dist/backuplist2/
          cd dist && zip -r9 backuplist2-${GITHUB_REF_NAME//\//-}.zip backuplist2
      - uses: actions/upload-artifact@v4
        with:
          name: backuplist2
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: CHANGELOG.md
